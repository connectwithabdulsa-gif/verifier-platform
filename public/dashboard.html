<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Verifier Beta</title><style>body{font:15px system-ui;background:#0b1020;color:#e8eefc;max-width:1100px;margin:40px auto;padding:0 20px}input,button,textarea{font:inherit;padding:10px;border-radius:7px;border:1px solid #34405f;background:#141c31;color:inherit}button{cursor:pointer;background:#2457e6}textarea{width:100%;height:130px;box-sizing:border-box}section{background:#12192b;padding:20px;border-radius:12px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:#19233a;padding:16px;border-radius:9px}.muted{color:#9cadcc}.beta{color:#f7c35f}pre{white-space:pre-wrap;overflow:auto}</style></head><body><h1>Verifier <span class="beta">Controlled Beta</span></h1><p class="muted">Tenant operations and verification jobs</p><section><input id="key" type="password" placeholder="API key"><button onclick="save()">Use key</button><button onclick="account()">Load account</button><div id="account" class="grid"></div></section><section><h2>Bulk verification</h2><textarea id="emails" placeholder="one email per line"></textarea><button onclick="createJob()">Create job</button></section><section><h2>Job</h2><input id="job" placeholder="bulk job id"><button onclick="loadJob()">Refresh</button><button onclick="download()">Download CSV</button><div id="summary" class="grid"></div><pre id="output"></pre></section><script>const el=s=>document.querySelector(s),key=()=>localStorage.verifierKey||'';el('#key').value=key();function save(){localStorage.verifierKey=el('#key').value}async function api(path,o={}){o.headers={...(o.headers||{}),authorization:'Bearer '+key(),'content-type':'application/json'};const r=await fetch(path,o);if(!r.ok)throw Error(await r.text());return r.json()}const cards=(target,values)=>el(target).innerHTML=Object.entries(values).map(([k,v])=>`<div class=card><div class=muted>${k}</div><strong>${v}</strong></div>`).join('');async function account(){const a=await api('/v1/account');cards('#account',{release:'controlled beta',plan:a.plan,status:a.status,used:a.usage.used,quota:a.usage.limit})}async function createJob(){const emails=el('#emails').value.split(/\r?\n/).filter(Boolean),j=await api('/v1/bulk-jobs',{method:'POST',headers:{'idempotency-key':crypto.randomUUID()},body:JSON.stringify({emails})});el('#job').value=j.id;loadJob()}async function loadJob(){const j=await api('/v1/bulk-jobs/'+el('#job').value);cards('#summary',{total:j.total,completed:j.completed,failed:j.failed,progress:Math.round(j.progress*100)+'%'});el('#output').textContent=JSON.stringify(j.items,null,2)}async function download(){const r=await fetch('/v1/bulk-jobs/'+el('#job').value+'/export',{headers:{authorization:'Bearer '+key()}});if(!r.ok)throw Error(await r.text());const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=el('#job').value+'.csv';a.click()}</script></body></html>
